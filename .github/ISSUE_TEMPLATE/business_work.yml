name: Business work
description: Define an operational, offer, content, or growth outcome.
title: "[Business]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private conversations, customer data, or payment details.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be meaningfully different when this is complete?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why now?
      description: What evidence, request, or recurring friction makes this worth doing?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that define done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Evidence and measurement
      description: How will we know the change helped?
  - type: textarea
    id: risks
    attributes:
      label: Risks or privacy considerations
      description: Note affected people, promises, data, or systems without including sensitive values.
